<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ra lệnh rõ – Kiểm chứng giỏi · Tech Club Tuần 2</title>
<style>
:root{--bg:#130d26;--card:#241a52;--card2:#170f3a;--ink:#f3eefc;--mut:#b7a9e6;--gold:#f2c94c;--ok:#5ef2a0;--bad:#ff6b8a;--sky:#59b8ff;--pix:"VT323","Consolas","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--pix);font-size:19px;line-height:1.35}
html{background:#130d26}body{background:radial-gradient(ellipse 1400px 900px at top,#2a1c5c 0,#130d26 70%) no-repeat #130d26;min-height:100vh}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.42) 100%)}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(19,13,38,.95);border-bottom:4px solid #000}
.logo{width:38px;height:38px;border-radius:50%;background:#14306e;display:grid;align-content:center;gap:4px;padding:0 9px;border:3px solid #000;flex:none}
.logo i{display:block;height:4px}
header h1{margin:0;font-size:25px;color:var(--gold);text-shadow:3px 3px 0 #000;flex:1;min-width:0}
header h1 small{display:block;font-size:14px;color:var(--mut);text-shadow:none;font-weight:400}
.hud{background:var(--card);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:3px 10px;white-space:nowrap;font-size:16px}
header button{font-size:15px;padding:4px 10px}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:16px 18px;margin-bottom:18px}
.card.gold{border-color:var(--gold)}
h2{margin:0 0 8px;font-size:28px;color:#fff;text-shadow:2px 2px 0 #000}
h3{margin:14px 0 6px;font-size:21px;color:var(--gold)}
.tag{color:var(--gold);font-size:16px;letter-spacing:.5px}
.mut{color:var(--mut)}.good{color:var(--ok)}.bad{color:var(--bad)}
p{margin:6px 0 10px}
ul,ol{margin:4px 0 10px;padding-left:24px}
button{font:inherit;font-weight:700;color:#1a1033;background:var(--gold);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.12);transform:translate(-1px,-1px)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:var(--card2);color:var(--ink)}
button.sky{background:var(--sky)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
canvas.pix{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #000;background:#000;box-shadow:4px 4px 0 #000}
.cap{font-size:16px;color:var(--mut);margin:6px 0 0;text-align:center}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.menu{grid-template-columns:1fr}}
.menu button{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.menu button b{font-size:23px}.menu button span{font-weight:400;font-size:16px}
.opt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.opt button{padding:6px 12px;background:var(--card2);color:var(--ink)}
.opt button.on{background:var(--gold);color:#1a1033}
input[type=text],textarea{font:inherit;font-weight:400;width:100%;background:#0f0a24;color:var(--ink);border:3px solid #000;padding:10px 12px}
textarea{min-height:110px;resize:vertical;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:17px;margin:8px 0}
th,td{border:2px solid #000;padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card2);color:var(--gold);font-weight:400}
td.ok{color:var(--ok)}td.bad{color:var(--bad)}td.unclear{color:#ffb86b}td.guess{color:var(--sky)}
.score{font-size:30px;color:#fff;text-shadow:2px 2px 0 #000;margin:12px 0 8px}
.stars{color:var(--gold);letter-spacing:3px}
.crow{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed rgba(183,169,230,.22)}
@media(max-width:600px){.crow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:400;padding:4px 10px;background:var(--card2);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 #000}
.chip.on{background:var(--gold);color:#1a1033;font-weight:700}
.sw{display:inline-block;width:15px;height:15px;border:2px solid #000}
.prompt{background:#0f0a24;border:3px dashed var(--gold);padding:10px 12px;font-size:21px;word-break:break-word;margin:8px 0}
.meter{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0}
.meter .bar{height:20px;background:#0f0a24;border:3px solid #000;position:relative}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sky)}
.meter .bar.best i{background:var(--ok)}
.teams{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.teams{grid-template-columns:1fr 1fr}}
.team{border:4px solid #000;box-shadow:4px 4px 0 #000;padding:8px 10px;color:#1a1033;text-align:center}
.team b{display:block;font-size:20px}.team .pts{font-size:40px;line-height:1;font-weight:700}.team small{font-size:14px}
.team.act{outline:5px solid #fff;outline-offset:2px;animation:pulse .7s steps(2) infinite}
.team.out{opacity:.35}
@keyframes pulse{50%{outline-color:transparent}}
.stage{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.speech{background:#fff;color:#141414;border:4px solid #000;box-shadow:5px 5px 0 #000;padding:14px 18px;font-size:30px;line-height:1.25;position:relative;min-height:3.4em}
.speech:before{content:"";position:absolute;left:-22px;top:28px;border:10px solid transparent;border-right:12px solid #000}
.big{font-size:90px;line-height:1.1;text-align:center}
.verdict{font-size:40px;text-shadow:3px 3px 0 #000;margin:6px 0}
.method{display:inline-block;background:var(--sky);color:#1a1033;border:3px solid #000;padding:3px 10px;font-weight:700}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf button{font-size:36px;text-align:center;padding:16px}
.tf .t{background:var(--ok)}.tf .f{background:var(--bad)}
.hint{background:#fff7d6;color:#3a2a00;border:4px solid #000;padding:10px 14px;margin-top:12px;font-size:22px}
.kbd{display:inline-block;background:#000;color:#fff;padding:0 6px;border:2px solid #fff;font-size:15px;margin-right:6px;vertical-align:middle}
.ans{background:var(--card2);border:3px solid #000;padding:12px 14px;margin-top:10px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,15,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
#modal[hidden]{display:none}
#modal .card{max-width:880px;width:100%}
.hide{visibility:hidden}
.shake{animation:sh .4s steps(4)}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s steps(4)}@keyframes pop{from{transform:scale(.94)}}
.bob{animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.shake,.pop,.bob,.team.act{animation:none}}
@media(max-width:700px){header{flex-wrap:wrap;gap:8px}header h1{font-size:19px;flex:1 1 60%}header h1 small{display:none}.hud{font-size:13px;order:3;flex-basis:100%;text-align:center}.speech{font-size:22px}.big{font-size:64px}.tf button{font-size:26px}}
#bot{max-width:130px}
</style>
</head>
<body>
<div id="crt"></div>
<header>
 <div class="logo"><i style="background:#5ef2a0"></i><i style="background:#f2c94c"></i><i style="background:#59b8ff"></i></div>
 <h1>Ra lệnh rõ – Kiểm chứng giỏi<small>Tech Club · Week 2 · Ask better, check smarter</small></h1>

 <button class="ghost" id="hMenu" title="Menu: đi tới phần khác, cài đặt">☰ Menu</button>
</header>
<main id="app"></main>

<script>

const TARGETS=[
 {name:'Khởi động',s:{ch:'meo',col:'cam',bg:'bien'},key:['ch','col','bg'],
  tip:'Logi Drawy chỉ chắc chắn với những gì em nói ra. Hãy nói rõ nhân vật, màu và nơi chốn.'},

  tip:'Nếu không muốn Logi Drawy tự thêm đồ vật, em phải nói rõ: “không cầm gì”.'}

 {t:'nhi',e:'🐧',s:'Chim cánh cụt bay rất giỏi.',a:false,m:'tra',x:'Chim cánh cụt không bay được, nhưng bơi lặn rất giỏi.',h:'Chim cánh cụt di chuyển dưới nước hay trên trời?'},
 {t:'nhi',e:'🧊',s:'Đá lạnh để ngoài nắng sẽ tan thành nước.',a:true,m:'thu',x:'Đúng! Thử để một viên đá ngoài nắng là thấy ngay.',h:'Em đã bao giờ để quên ly nước đá ngoài trời chưa?'},

 {t:'nhi',pic:'meo5',say:'Mình vừa vẽ xong: “Đây là một con mèo hoàn toàn bình thường!”',a:false,m:'dem',x:'Con mèo trong tranh có 5 chân! Mèo thật chỉ có 4 chân. AI tạo ảnh đôi khi vẽ sai số chân, số ngón tay.',h:'Đếm thật kỹ từng cái chân của con mèo nhé.'},
 {t:'nhi',e:'🌙',s:'Mặt Trăng tự phát ra ánh sáng giống như bóng đèn.',a:false,m:'thay',x:'Mặt Trăng không tự phát sáng. Nó sáng vì phản chiếu ánh sáng của Mặt Trời, giống như một tấm gương.',h:'Mặt Trăng giống một tấm gương hay giống một bóng đèn?'},
 {t:'nhi',e:'⌨️',s:'Bàn phím máy tính có phím chữ A.',a:true,m:'thu',x:'Đúng! Nhìn xuống bàn phím trước mặt là thấy ngay.',h:'Câu này em kiểm chứng được trong 1 giây!'},
 {t:'nhi',e:'🌍',s:'Trái Đất có hình gần giống một quả bóng tròn.',a:true,m:'tra',x:'Đúng! Ảnh chụp từ vũ trụ cho thấy Trái Đất gần tròn như quả bóng.',h:'Em đã thấy quả địa cầu trong lớp chưa?'},
 {t:'pro',e:'🚀',s:'Tàu Apollo 13 đã đáp xuống Mặt Trăng thành công.',a:false,m:'tra',x:'Apollo 13 gặp sự cố trên đường bay nên phải quay về Trái Đất, không đáp xuống Mặt Trăng. Phi hành đoàn trở về an toàn.',h:'Apollo 13 nổi tiếng vì một sự cố trên đường bay.'},

 ['Thầy cô sẽ giúp các em hai việc: ra lệnh thật rõ, và kiểm chứng trước khi tin. Bắt đầu nào!',{ch:'robot',col:'xanhduong',n:1,item:'bongbay',icol:'do',bg:'lop'}]

const $=s=>document.querySelector(s),app=$('#app'),hud=$('#hud');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
let SCREEN='',TIMERS=[];
function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t)});TIMERS=[]}
function show(html,name){clearTimers();SCREEN=name||'';app.innerHTML=html;window.scrollTo(0,0)}
function setHud(t){hud.textContent=t}

const V={ch:{robot:'Robot',meo:'Mèo',khunglong:'Khủng long',phihanhgia:'Phi hành gia',cho:'Chó'},

function parsePrompt(text){const raw=text.toLowerCase().normalize('NFC').match(/[\p{L}\p{N}]+/gu)||[],tk=prepass(raw),M=[];let i=0;

 <h3>Phần 1: chọn tranh</h3><p class="mut" style="font-size:16px">Cho đội đến muộn: vào thẳng tranh bất kỳ. Kết quả các tranh đã chơi vẫn được giữ.</p>
 <div class="btns">${TARGETS.map((t,i)=>`<button data-pic="${i}" class="${inP1&&P1.idx===i?'':'ghost'}">${i+1}. ${esc(t.name)}</button>`).join('')}${hasP1Res()?'<button class="ghost" data-go="p1final">Tổng kết Phần 1</button>':''}</div>
 <h3>Phần 2: Thật hay Bịa?</h3><div class="btns">${p2Live()?`<button data-go="p2cont">Tiếp tục ván đang chơi (câu ${Q.i+1}/${Q.list.length})</button>`:''}<button class="ghost" data-go="p2new">Thiết lập ván mới</button></div>
 <h3>Cài đặt Phần 1 (có hiệu lực ngay)</h3><p style="margin-bottom:0">Xem tranh mẫu</p><div class="opt" id="mShow">${optBtns([[5,'5 giây'],[10,'10 giây'],[0,'Luôn hiện']],P1.show)}</div>
 <p style="margin-bottom:0">Chế độ</p><div class="opt" id="mMode">${optBtns([['nhi','🟢 Nhí: chọn hình'],['pro','🔵 Pro: tự gõ mô tả']],P1.mode)}</div>
 <div class="btns"><button id="mClose">Đóng ✕</button></div></div>`;
 const go={home,intro,guide:()=>guide(),p1final:p1Final,p2cont:renderQ,p2new:p2Setup};
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const k=b.dataset.go;closeModal();go[k]()});
 m.querySelectorAll('[data-pic]').forEach(b=>b.onclick=()=>{if(!hasP1Res()&&P1.res.length!==TARGETS.length)P1.res=TARGETS.map(()=>[]);P1.idx=+b.dataset.pic;closeModal();p1Show()});
 bindOpt('mShow',v=>{P1.show=+v;applyP1()});bindOpt('mMode',v=>{P1.mode=v;applyP1()});$('#mClose').onclick=closeModal}
function applyP1(){if(SCREEN!=='p1')return;if($('#pr'))P1.prev=$('#pr').value;if(P1.view==='input')p1Input();else if(P1.view==='show'){if(P1.show)p1Show();else p1Input()}else if(P1.view==='setup')p1Setup()}
$('#hMenu').onclick=menu;
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
intro();
</script>
</body>
</html>
