<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hôm nay là người học, ngày mai là người dẫn lối · Tech Club Tuần 4</title>
<style>
:root{--bg:#130d26;--card:#241a52;--card2:#170f3a;--ink:#f3eefc;--mut:#b7a9e6;--gold:#f2c94c;--ok:#5ef2a0;--bad:#ff6b8a;--sky:#59b8ff;--pix:"VT323","Consolas","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--pix);font-size:19px;line-height:1.35}
html{background:#130d26}body{background:radial-gradient(ellipse 1400px 900px at top,#2a1c5c 0,#130d26 70%) no-repeat #130d26;min-height:100vh}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.42) 100%)}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(19,13,38,.95);border-bottom:4px solid #000}
.logo{width:38px;height:38px;border-radius:50%;background:#14306e;display:grid;align-content:center;gap:4px;padding:0 9px;border:3px solid #000;flex:none}
.logo i{display:block;height:4px}
header h1{margin:0;font-size:25px;color:var(--gold);text-shadow:3px 3px 0 #000;flex:1;min-width:0}
header h1 small{display:block;font-size:14px;color:var(--mut);text-shadow:none;font-weight:400}
.hud{background:var(--card);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:3px 10px;white-space:nowrap;font-size:16px}
header button{font-size:15px;padding:4px 10px}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:16px 18px;margin-bottom:18px}
.card.gold{border-color:var(--gold)}
h2{margin:0 0 8px;font-size:28px;color:#fff;text-shadow:2px 2px 0 #000}
h3{margin:14px 0 6px;font-size:21px;color:var(--gold)}
.tag{color:var(--gold);font-size:16px;letter-spacing:.5px}
.mut{color:var(--mut)}.good{color:var(--ok)}.bad{color:var(--bad)}
p{margin:6px 0 10px}
ul,ol{margin:4px 0 10px;padding-left:24px}
button{font:inherit;font-weight:700;color:#1a1033;background:var(--gold);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.12);transform:translate(-1px,-1px)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:var(--card2);color:var(--ink)}
button.sky{background:var(--sky)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.menu.two{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.menu,.menu.two{grid-template-columns:1fr}}
.menu button{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.menu button b{font-size:23px}.menu button span{font-weight:400;font-size:16px}
.menu button.done{outline:3px solid var(--ok)}
.opt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.opt button{padding:6px 12px;background:var(--card2);color:var(--ink)}
.opt button.on{background:var(--gold);color:#1a1033}
input[type=text],input[type=number],textarea,select{font:inherit;font-weight:400;width:100%;background:#0f0a24;color:var(--ink);border:3px solid #000;padding:8px 12px}
textarea{min-height:140px;resize:vertical;font-size:20px}
input[type=checkbox]{width:22px;height:22px;accent-color:#f2c94c;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:17px;margin:8px 0}
th,td{border:2px solid #000;padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card2);color:var(--gold);font-weight:400}
.crow{display:grid;grid-template-columns:200px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed rgba(183,169,230,.22)}
@media(max-width:600px){.crow{grid-template-columns:1fr}}
.prompt{background:#0f0a24;border:3px dashed var(--gold);padding:10px 12px;font-size:24px;word-break:break-word;margin:8px 0}
pre.code{background:#0f0a24;border:3px solid #000;padding:10px 14px;font:inherit;font-size:24px;white-space:pre-wrap;margin:8px 0}
.speech{background:#fff;color:#141414;border:4px solid #000;box-shadow:5px 5px 0 #000;padding:14px 18px;font-size:30px;line-height:1.25;min-height:3.4em}
.big{font-size:90px;line-height:1.1;text-align:center}
.stage{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.hint{background:#fff7d6;color:#3a2a00;border:4px solid #000;padding:10px 14px;margin-top:12px;font-size:22px}
.ans{background:var(--card2);border:3px solid #000;padding:12px 14px;margin-top:10px}
.corners{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.corner{border:4px solid #000;box-shadow:4px 4px 0 #000;padding:10px 12px;color:#1a1033}
.corner b{display:block;font-size:24px}.corner small{font-size:16px;display:block;margin-bottom:6px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,15,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
#modal[hidden]{display:none}
#modal .card{max-width:880px;width:100%}
.pop{animation:pop .35s steps(4)}@keyframes pop{from{transform:scale(.94)}}
.bob{animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.pop,.bob{animation:none}}
@media(max-width:700px){header{flex-wrap:wrap;gap:8px}header h1{font-size:19px;flex:1 1 60%}header h1 small{display:none}.hud{font-size:13px;order:3;flex-basis:100%;text-align:center}.speech{font-size:22px}.big{font-size:64px}}
</style>
</head>
<body>
<div id="crt"></div>
<header>
 <div class="logo"><i style="background:#5ef2a0"></i><i style="background:#f2c94c"></i><i style="background:#59b8ff"></i></div>
 <h1>Skill Swap Arena<small>Tech Club · Week 4 · Become the mentor</small></h1>
 <div class="hud" id="hud">Tech Club · Tuần 4</div>
 <button class="ghost" id="hMenu" title="Menu: đi tới phần khác">☰ Menu</button>
</header>
<main id="app"></main>
<div id="modal" hidden></div>
<script>
// =====================================================================
//  PHẦN THẦY CÔ CÓ THỂ CHỈNH SỬA
//  TYP: câu gõ phím (Vòng 1).   DRAW: đề vẽ 60 giây (Vòng 2).
//  FIX: đoạn code có lỗi cho Vòng 4 (c: code, a: đáp án). Đổi sang ngôn ngữ lớp đang học nếu cần,
//       hoặc thay bằng bài Scoolcode thật của lớp.
//  PR: cảnh mẫu của Vòng 5 (t: mô tả, k: các chi tiết được chấm điểm).
//  LG: câu đố logic của Vòng 6 (q: câu hỏi, a: đáp án).
// =====================================================================
const TYP=['Người thầy giỏi không trao sẵn đáp án, mà giúp con tự tìm ra.','Hôm nay là người học, ngày mai là người dẫn lối.','Thầy cô dạy con cách học, kể cả cách học cùng AI.','Cảm ơn những người dẫn lối đã giúp con lớn lên mỗi ngày.'];
const DRAW=['Chú robot đang uống trà sữa','Khủng long đội mũ phi hành gia','Chú mèo đạp xe đạp','Ngôi nhà trên cây có wifi','Thầy giáo siêu nhân'];
const FIX=[
 {c:'for i in range(5)\n    print("Xin chào", i)',a:'Thiếu dấu hai chấm “:” ở cuối dòng for.'},
 {c:'name = "Mai"\nprint("Chào " + nme)',a:'Gõ sai tên biến: phải là name, không phải nme.'},
 {c:'x = 3\nwhile x > 0:\n    print(x)',a:'Vòng lặp chạy mãi vì thiếu dòng x = x - 1 trong vòng lặp.'}];
const PR=[
 {t:'Một chú rồng xanh đội mũ đỏ đang đọc sách trên đỉnh núi lúc hoàng hôn.',k:['Nhân vật: rồng','Màu: xanh','Phụ kiện: mũ đỏ','Hành động: đọc sách','Địa điểm: đỉnh núi','Thời gian: hoàng hôn']},
 {t:'Hai chú mèo vàng mặc áo mưa đang chơi cờ vua trong thư viện vào ban đêm.',k:['Nhân vật: mèo','Số lượng: hai chú','Màu: vàng','Phụ kiện: áo mưa','Hành động: chơi cờ vua','Địa điểm + thời gian: thư viện, ban đêm']}];
const LG=[
 {q:'An, Bình, Chi xếp hàng. An không đứng đầu. Bình đứng sau Chi. Ai đứng đầu hàng?',a:'Chi. Bình đứng sau Chi nên Bình không đứng đầu, An cũng không, nên chỉ còn Chi.'},
 {q:'Dãy số: 2, 4, 8, 16, ?  Số tiếp theo là gì và quy luật là gì?',a:'32. Mỗi số gấp đôi số đứng trước.'},
 {q:'Ba hộp dán nhãn “Táo”, “Cam”, “Táo và Cam”, nhưng cả ba nhãn đều dán sai. Lấy một quả từ hộp “Táo và Cam” ra được quả táo. Hộp đó chứa gì?',a:'Chỉ có táo. Vì nhãn sai nên hộp này không thể chứa cả hai loại.'}];
// =====================================================================

const $=s=>document.querySelector(s),app=$('#app'),hud=$('#hud');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let SCREEN='',TIMERS=[];
function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t)});TIMERS=[]}
function show(html,name){clearTimers();SCREEN=name||'';app.innerHTML=html;window.scrollTo(0,0)}
function setHud(t){hud.textContent=t}
function optBtns(list,cur){return list.map(([v,l])=>`<button data-v="${v}" class="${String(v)===String(cur)?'on':''}">${l}</button>`).join('')}
function bindOpt(id,fn){const box=$('#'+id);box.onclick=e=>{const b=e.target.closest('button');if(!b)return;box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.type='square';o.frequency.value=660;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),350)}catch(e){}}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const COL=['#ff6b8a','#59b8ff','#f2c94c','#5ef2a0','#ff9f5a','#c59bff'];

// ===== TRẠNG THÁI =====
const S={trainer:'Thầy/Cô',names:['Minh','An','Bảo','Chi','Dũng','Hà'],players:[],res:{},pk:{},lv:4,rot:0,mins:4,done:{},trick:{},rk:'type',re:{}};
function buildPlayers(){S.players=[{n:S.trainer||'Thầy/Cô',t:1},...S.names.map(n=>({n}))]}
buildPlayers();
const pn=i=>{const p=S.players[i];return p?(p.t?'🎓 ':'')+p.n:'?'};

// ===== CÁC VÒNG THI =====
function cyc(key,len,elId,btn,fn){const el=$('#'+elId);$('#'+btn).onclick=()=>{S.pk[key]=((S.pk[key]||0)+1)%len;fn(el,S.pk[key])}}
function reveal(){$('#rv').onclick=()=>{$('#ra').hidden=!$('#ra').hidden}}
const ROUNDS=[
 {k:'type',ic:'⌨️',name:'Gõ phím thần tốc',area:'Gõ phím',sec:45,unit:'số từ gõ đúng',better:'high',
  desc:'Cả lớp gõ lại câu bên dưới nhanh và chính xác nhất có thể. Thầy cô cũng gõ cùng các em!',
  body:()=>`<div class="card"><div class="prompt" id="tx" style="font-size:30px">${esc(TYP[S.pk.type||0])}</div><div class="btns"><button class="ghost" id="nx">Câu khác</button></div></div>`,
  bind:()=>cyc('type',TYP.length,'tx','nx',(e,i)=>e.textContent=TYP[i])},
 {k:'draw',ic:'🎨',name:'Vẽ trong 60 giây',area:'Vẽ nhanh',sec:60,unit:'điểm (1–10)',better:'high',
  desc:'Vẽ đề bài trong 60 giây, bằng giấy bút hoặc phần mềm vẽ. Cả lớp bình chọn bức tranh dễ nhận ra nhất.',
  body:()=>`<div class="card"><div class="prompt" id="tx" style="font-size:30px">${esc(DRAW[S.pk.draw||0])}</div><div class="btns"><button class="ghost" id="nx">Đề khác</button></div></div>`,
  bind:()=>cyc('draw',DRAW.length,'tx','nx',(e,i)=>e.textContent=DRAW[i])},
 {k:'mem',ic:'🧠',name:'Siêu trí nhớ',area:'Trí nhớ',sec:0,unit:'số biểu tượng nhớ đúng',better:'high',
  desc:'Nhìn dãy biểu tượng, che lại, rồi viết ra đúng thứ tự. Tăng dần độ dài dãy để tìm ra người nhớ giỏi nhất.',
  body:()=>`<div class="card"><div class="big" id="mm" style="font-size:56px;min-height:1.4em">Sẵn sàng?</div><p class="mut" style="text-align:center">Độ dài dãy: <b id="lv">${S.lv}</b></p><div class="btns" style="justify-content:center"><button id="mShow">Hiện dãy</button><button class="ghost" id="mAns">Hiện đáp án</button><button class="ghost" id="mUp">Dài hơn +1</button><button class="ghost" id="mDn">Ngắn hơn −1</button></div></div>`,
  bind:()=>{let seq=[];const mm=$('#mm'),lv=$('#lv'),P=['🍎','🚀','🐱','⚽','🎲','🌈','🎧','🦖','🍕','🔑','🧩','⭐','🎸','🐳'];
   $('#mShow').onclick=()=>{seq=shuffle(P).slice(0,S.lv);mm.textContent=seq.join(' ');TIMERS.push(setTimeout(()=>{mm.textContent=seq.map(()=>'❓').join(' ')},S.lv*900+1500))};
   $('#mAns').onclick=()=>{mm.textContent=seq.length?seq.join(' '):'Chưa có dãy'};
   $('#mUp').onclick=()=>{S.lv=Math.min(14,S.lv+1);lv.textContent=S.lv};$('#mDn').onclick=()=>{S.lv=Math.max(3,S.lv-1);lv.textContent=S.lv}}},
 {k:'fix',ic:'🛠️',name:'Scoolcode sửa lỗi nhanh',area:'Sửa lỗi code',sec:90,unit:'giây hoàn thành',better:'low',
  desc:'Tìm và sửa lỗi trong đoạn code. Ai sửa đúng nhanh nhất thắng. Có thể thay bằng bài Scoolcode thật của lớp.',
  body:()=>{const f=FIX[S.pk.fix||0];return `<div class="card"><pre class="code" id="tx">${esc(f.c)}</pre><div class="btns"><button class="ghost" id="nx">Đoạn khác</button><button class="sky" id="rv">Hiện đáp án</button></div><div class="ans" id="ra" hidden>${esc(f.a)}</div></div>`},
  bind:()=>{cyc('fix',FIX.length,'tx','nx',(e,i)=>{e.textContent=FIX[i].c;$('#ra').textContent=FIX[i].a;$('#ra').hidden=true});reveal()}},
 {k:'prompt',ic:'💬',name:'Thử thách prompt',area:'Ra lệnh cho AI',sec:60,unit:'số chi tiết đúng',better:'high',
  desc:'Xem cảnh mẫu vài giây rồi viết prompt để AI vẽ lại thật giống. Thầy cô tích các chi tiết mà prompt có nhắc tới.',
  body:()=>{const p=PR[S.pk.prompt||0];return `<div class="card"><div class="prompt" id="tx" style="font-size:28px">${esc(p.t)}</div><div class="btns"><button class="sky" id="hide">Che cảnh mẫu</button><button class="ghost" id="nx">Cảnh khác</button></div>
   <h3>Chi tiết được chấm</h3><div id="kk">${p.k.map(x=>`<p style="margin:2px 0"><label><input type="checkbox"> ${esc(x)}</label></p>`).join('')}</div></div>`},
  bind:()=>{const tx=$('#tx'),kk=$('#kk'),cnt=()=>{const n=kk.querySelectorAll('input:checked').length;$('#val').value=n};
   kk.onchange=cnt;$('#hide').onclick=()=>{tx.dataset.t=tx.textContent;tx.textContent='🙈 Cảnh mẫu đã được che. Hãy viết prompt!'};
   cyc('prompt',PR.length,'tx','nx',(e,i)=>{e.textContent=PR[i].t;kk.innerHTML=PR[i].k.map(x=>`<p style="margin:2px 0"><label><input type="checkbox"> ${esc(x)}</label></p>`).join('')})}},
 {k:'logic',ic:'🧩',name:'Đố logic',area:'Logic',sec:0,unit:'số câu đúng',better:'high',
  desc:'Giải câu đố logic. Ai trả lời đúng và giải thích được cách nghĩ thì ghi điểm.',
  body:()=>{const l=LG[S.pk.logic||0];return `<div class="card"><div class="prompt" id="tx" style="font-size:26px">${esc(l.q)}</div><div class="btns"><button class="ghost" id="nx">Câu khác</button><button class="sky" id="rv">Hiện đáp án</button></div><div class="ans" id="ra" hidden>${esc(l.a)}</div></div>`},
  bind:()=>{cyc('logic',LG.length,'tx','nx',(e,i)=>{e.textContent=LG[i].q;$('#ra').textContent=LG[i].a;$('#ra').hidden=true});reveal()}}
];
const champ=r=>{const x=S.res[r.k];return x&&x.w!==undefined?x:null};

// ===== ĐỒNG HỒ =====
function timer(sec){return `<div class="card" style="text-align:center"><div class="big" id="tm">${fmt(sec)}</div><div class="btns" style="justify-content:center"><button id="tGo">▶ Bắt đầu</button><button class="ghost" id="tRs">↺ Đặt lại</button></div></div>`}
function bindTimer(sec){let left=sec,iv=null;const d=$('#tm'),draw=()=>{d.textContent=fmt(left)};
 $('#tGo').onclick=()=>{if(iv)return;if(left<=0)left=sec;iv=setInterval(()=>{left--;draw();if(left<=0){clearInterval(iv);iv=null;beep();d.textContent='HẾT GIỜ!'}},1000);TIMERS.push(iv)};
 $('#tRs').onclick=()=>{clearInterval(iv);iv=null;left=sec;draw()}}

// ===== MÀN HÌNH =====
const INTRO=[['🎓','Tuần này đảo vai: các em không chỉ học, các em sẽ trở thành người dẫn lối!'],['⚔️','Có sáu thử thách nhanh. Thầy cô và tất cả học sinh cùng thi đấu.'],['🏆','Ai thắng vòng nào sẽ làm mentor của kỹ năng đó. Thầy cô cũng có thể thua, và thua cũng là một cách học!'],['🧑‍🏫','Sau đó các nhà vô địch sẽ kèm cả lớp ở các góc mentor. Dạy lại cho người khác là cách học rất tốt.'],['🚀','Mở màn Skill Swap Arena nào!']];
let IN=0;
function intro(){IN=0;setHud('Giới thiệu');
 show(`<div class="card gold pop"><div class="stage"><div class="big bob" id="em"></div><div class="speech" id="cap"></div></div>
 <div class="btns"><button id="inext">Tiếp ▶</button><button class="ghost" id="iskip">Bỏ qua phần giới thiệu</button></div></div>`,'intro');
 line();$('#inext').onclick=()=>{if(++IN>=INTRO.length)setup();else line()};$('#iskip').onclick=setup}
function line(){clearTimers();const[e,s]=INTRO[IN],el=$('#cap');$('#em').textContent=e;let i=0;const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}el.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(iv)},28);TIMERS.push(iv);$('#inext').textContent=IN===INTRO.length-1?'Bắt đầu ▶':'Tiếp ▶'}

function setup(){setHud('Chuẩn bị');
 show(`<div class="card gold pop"><div class="tag">CHUẨN BỊ · AI THAM GIA?</div><h2>Thầy cô và học sinh cùng thi đấu</h2>
 <p>Mỗi người là một thí sinh. Thầy cô cũng tham gia để các em có cơ hội trở thành mentor của chính thầy cô.</p>
 <div class="crow"><span>Tên thầy cô (🎓)</span><input type="text" id="tr" maxlength="24" value="${esc(S.trainer)}"></div>
 <h3>Học sinh (mỗi dòng một tên)</h3><textarea id="nm">${esc(S.names.join('\n'))}</textarea>
 <div class="btns"><button id="go">Vào đấu trường ▶</button></div></div>`,'setup');
 $('#go').onclick=()=>{S.trainer=$('#tr').value.trim()||'Thầy/Cô';S.names=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!S.names.length){$('#nm').value='Học sinh 1';return}S.res={};S.re={};S.done={};buildPlayers();home()}}

function home(){setHud('Tech Club · Tuần 4');
 show(`<div class="card gold pop"><div class="tag">TECH CLUB · TUẦN 4 · BECOME THE MENTOR</div><h2>Hôm nay là người học, ngày mai là người dẫn lối</h2>
 <p>Ai cũng giỏi một điều gì đó. Khi dạy điều đó cho người khác, cả hai cùng giỏi hơn, thầy cô cũng vậy.</p></div>
 <div class="menu two"><button id="m1"><b>1 ⚔️ Vòng thử thách</b><span>Sáu thử thách nhanh: gõ phím, vẽ 60 giây, trí nhớ, sửa lỗi code, prompt, logic.</span></button>
 <button id="m2" class="sky"><b>2 🏆 Nhà vô địch</b><span>Người thắng mỗi vòng trở thành mentor của kỹ năng đó.</span></button>
 <button id="m3"><b>3 🧑‍🏫 Góc mentor</b><span>Các nhà vô địch kèm cả lớp, xoay vòng giữa các góc.</span></button>
 <button id="m4" class="sky"><b>4 ✨ Show me what you learned</b><span>Mỗi em khoe một mẹo vừa học được. Còn thời gian thì đấu lại.</span></button></div>
 <div class="btns"><button class="ghost" id="m5">Hướng dẫn cho thầy cô</button><button class="ghost" id="m6">Đổi danh sách thí sinh</button><button class="ghost" id="m7">Xem lại phần giới thiệu</button></div>`,'home');
 $('#m1').onclick=arena;$('#m2').onclick=champs;$('#m3').onclick=corners;$('#m4').onclick=learn;$('#m5').onclick=guide;$('#m6').onclick=setup;$('#m7').onclick=intro}

function arena(){setHud('Vòng thử thách');
 show(`<div class="card gold pop"><div class="tag">PHẦN 1 · VÒNG THỬ THÁCH</div><h2>Chọn một thử thách</h2><p>Thầy cô và cả lớp thi đấu cùng nhau. Chơi theo thứ tự hoặc chọn vòng bất kỳ. Vòng đã có nhà vô địch được viền xanh.</p></div>
 <div class="menu">${ROUNDS.map((r,i)=>{const c=champ(r);return `<button data-i="${i}" class="${c?'done':'ghost'}"><b>${r.ic} ${i+1}. ${r.name}</b><span>${c?'🏆 '+esc(pn(c.w)):'Chưa có nhà vô địch'}</span></button>`}).join('')}</div>
 <div class="btns"><button id="toC">Xem nhà vô địch ▶</button><button class="ghost" id="back">Về màn hình chính</button></div>`,'arena');
 app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>round(+b.dataset.i));$('#toC').onclick=champs;$('#back').onclick=home}

function round(i){const r=ROUNDS[i],sv=S.res[r.k]||{};setHud(`Vòng ${i+1}/${ROUNDS.length} · ${r.name}`);
 show(`<div class="card gold pop"><div class="tag">VÒNG ${i+1}/${ROUNDS.length} · KỸ NĂNG: ${esc(r.area)}</div><h2>${r.ic} ${r.name}</h2><p>${r.desc}</p></div>
 ${r.body()}${r.sec?timer(r.sec):''}
 <div class="card"><h3>Ghi nhận nhà vô địch</h3>
 <div class="crow"><span>Người thắng</span><select id="win"><option value="">Chọn người thắng</option>${S.players.map((p,j)=>`<option value="${j}" ${sv.w===j?'selected':''}>${esc(pn(j))}</option>`).join('')}</select></div>
 <div class="crow"><span>Kết quả (${r.unit})</span><input type="number" id="val" step="any" value="${sv.val===undefined?'':esc(sv.val)}"></div>
 <div class="btns"><button id="save">Lưu và về danh sách</button>${i>0?'<button class="ghost" id="prev">◀ Vòng trước</button>':''}${i<ROUNDS.length-1?'<button class="ghost" id="next">Vòng sau ▶</button>':''}</div></div>`,'round');
 r.bind&&r.bind();r.sec&&bindTimer(r.sec);
 const keep=()=>{const w=$('#win').value;if(w!=='')S.res[r.k]={w:+w,val:$('#val').value}};
 $('#save').onclick=()=>{keep();arena()};if($('#prev'))$('#prev').onclick=()=>{keep();round(i-1)};if($('#next'))$('#next').onclick=()=>{keep();round(i+1)}}

function crowns(){const c={};ROUNDS.forEach(r=>{const x=champ(r);if(x)c[x.w]=(c[x.w]||0)+1});return c}
function champs(){setHud('Nhà vô địch');const cr=crowns(),rk=Object.keys(cr).map(Number).sort((a,b)=>cr[b]-cr[a]),n=ROUNDS.filter(champ).length;
 show(`<div class="card gold pop"><div class="tag">PHẦN 2 · NHÀ VÔ ĐỊCH</div><h2>Mỗi nhà vô địch là một mentor</h2>
 <table><tr><th>Kỹ năng</th><th>Thử thách</th><th>Mentor</th><th>Kết quả</th></tr>${ROUNDS.map(r=>{const c=champ(r);return `<tr><td>${esc(r.area)}</td><td>${r.ic} ${r.name}</td><td>${c?'🏆 '+esc(pn(c.w)):'<span class="mut">chưa có</span>'}</td><td>${c&&c.val!==''?esc(c.val)+' '+esc(r.unit):'-'}</td></tr>`}).join('')}</table>
 ${rk.length?`<h3>Ai giữ nhiều kỹ năng nhất</h3><p>${rk.map(j=>`<b>${esc(pn(j))}</b>: ${cr[j]} kỹ năng`).join(' · ')}</p>`:''}
 <p class="prompt" style="border-style:solid">Ai thắng vòng nào sẽ làm mentor của kỹ năng đó. ${S.players.some((p,j)=>p.t&&cr[j])?'Thầy cô cũng làm mentor, và thầy cô cũng có thể học từ các em.':'Nếu thầy cô thua ở một vòng, thầy cô sẽ là học trò của mentor đó.'}</p>
 <div class="btns"><button id="toK" ${n?'':'disabled'}>Sang góc mentor ▶</button><button class="ghost" id="toA">Quay lại vòng thử thách</button></div></div>`,'champs');
 $('#toK').onclick=corners;$('#toA').onclick=arena}

function corners(){setHud('Góc mentor');const R=3,ms=[];
 ROUNDS.forEach(r=>{const c=champ(r);if(c){let m=ms.find(x=>x.w===c.w);if(!m)ms.push(m={w:c.w,a:[]});m.a.push(r.area)}});
 if(!ms.length){show(`<div class="card gold pop"><h2>Chưa có mentor</h2><p>Hãy chơi các vòng thử thách và ghi nhận nhà vô địch trước.</p><div class="btns"><button id="b">Đến vòng thử thách ▶</button></div></div>`,'k0');$('#b').onclick=arena;return}
 const mw=ms.map(m=>m.w),others=S.players.map((p,j)=>j).filter(j=>!mw.includes(j)),C=ms.length,r=S.rot;
 const at=ms.map(()=>[]);others.forEach((j,k)=>at[(k+r)%C].push(j));
 show(`<div class="card gold pop"><div class="tag">PHẦN 3 · TEACH-BACK · LƯỢT ${r+1}/${R}</div><h2>Mentor kèm cả lớp</h2>
 <p>Mentor dạy cách làm, mẹo và lỗi hay gặp. Học viên thử ngay tại góc. Hết giờ thì xoay sang góc khác.</p>
 <div class="opt" id="oM">${optBtns([[3,'3 phút'],[4,'4 phút'],[5,'5 phút']],S.mins)}</div></div>
 <div class="corners">${ms.map((m,k)=>`<div class="corner" style="background:${COL[k%COL.length]}"><b>${esc(pn(m.w))}</b><small>Mentor: ${esc(m.a.join(', '))}</small>${at[k].length?at[k].map(j=>'• '+esc(pn(j))).join('<br>'):'Chưa có học viên'}</div>`).join('')}</div>
 <div style="height:18px"></div>${timer(S.mins*60)}
 <div class="btns"><button id="nr">${r<R-1?'Lượt tiếp theo ▶':'Xong, sang Show me ▶'}</button><button class="ghost" id="back">Về màn hình chính</button></div>`,'corners');
 bindTimer(S.mins*60);bindOpt('oM',v=>{S.mins=+v;corners()});
 $('#nr').onclick=()=>{if(r<R-1){S.rot++;corners()}else{S.rot=0;learn()}};$('#back').onclick=home}

function learn(){setHud('Show me what you learned');const kids=S.players.map((p,j)=>j).filter(j=>!S.players[j].t),n=kids.filter(j=>S.done[j]).length;
 show(`<div class="card gold pop"><div class="tag">PHẦN 4 · SHOW ME WHAT YOU LEARNED</div><h2>Khoe một mẹo mentor vừa dạy</h2>
 <p>Mỗi em chia sẻ một mẹo và nói rõ mentor nào đã dạy. Thầy cô tích khi em đã khoe xong.</p>
 ${kids.map(j=>`<div class="crow"><label><input type="checkbox" data-j="${j}" ${S.done[j]?'checked':''}> ${esc(S.players[j].n)}</label><input type="text" data-t="${j}" placeholder="Mẹo đã học (không bắt buộc)" value="${esc(S.trick[j]||'')}"></div>`).join('')}
 <p class="mut" id="cnt">Đã khoe: ${n}/${kids.length}</p>
 <div class="btns"><button id="rm">Đấu lại (rematch) ⟳</button><button class="sky" id="end">Tổng kết ▶</button><button class="ghost" id="back">Về màn hình chính</button></div></div>`,'learn');
 app.querySelectorAll('[data-j]').forEach(c=>c.onchange=()=>{S.done[c.dataset.j]=c.checked;$('#cnt').textContent='Đã khoe: '+kids.filter(j=>S.done[j]).length+'/'+kids.length});
 app.querySelectorAll('[data-t]').forEach(c=>c.oninput=()=>S.trick[c.dataset.t]=c.value);
 $('#rm').onclick=rematch;$('#end').onclick=end;$('#back').onclick=home}

function rematch(){setHud('Rematch');const r=ROUNDS.find(x=>x.k===S.rk)||ROUNDS[0],R=S.re[r.k]||(S.re[r.k]={}),c=champ(r);
 show(`<div class="card gold pop"><div class="tag">REMATCH · NẾU CÒN THỜI GIAN</div><h2>${r.ic} ${r.name}: ai tiến bộ nhất?</h2>
 <p>Chơi lại cùng thử thách. Nhập kết quả lần đầu và lần đấu lại. Mũi tên cho biết ai đã tiến bộ (${r.better==='low'?'số càng nhỏ càng tốt':'số càng lớn càng tốt'}).</p>
 <div class="opt" id="oR">${optBtns(ROUNDS.filter(x=>x.k!=='mem'||true).map(x=>[x.k,x.ic+' '+x.name]),S.rk)}</div>
 <table><tr><th>Thí sinh</th><th>Lần 1</th><th>Rematch</th><th>Thay đổi</th></tr>${S.players.map((p,j)=>{const a=R[j]&&R[j].a!==undefined?R[j].a:(c&&c.w===j?c.val:'');return `<tr><td>${esc(pn(j))}</td><td><input type="number" step="any" data-a="${j}" value="${esc(a)}"></td><td><input type="number" step="any" data-b="${j}" value="${R[j]&&R[j].b!==undefined?esc(R[j].b):''}"></td><td id="d${j}"></td></tr>`}).join('')}</table>
 <div class="btns"><button class="sky" id="end">Tổng kết ▶</button><button class="ghost" id="back">Quay lại</button></div></div>`,'rematch');
 const calc=j=>{const a=$(`[data-a="${j}"]`).value,b=$(`[data-b="${j}"]`).value,d=$('#d'+j);R[j]={a,b};if(a===''||b===''){d.textContent='';return}const x=+b-+a,up=r.better==='low'?x<0:x>0;d.innerHTML=x===0?'= giữ nguyên':`<span class="${up?'good':'bad'}">${up?'▲ tiến bộ':'▼ chưa tốt hơn'} (${x>0?'+':''}${Math.round(x*100)/100})</span>`};
 S.players.forEach((p,j)=>calc(j));app.querySelectorAll('input[data-a],input[data-b]').forEach(i=>i.oninput=()=>calc(i.dataset.a??i.dataset.b));
 bindOpt('oR',v=>{S.rk=v;rematch()});$('#end').onclick=end;$('#back').onclick=learn}

function end(){setHud('Tổng kết');
 show(`<div class="card gold pop"><div class="tag">TỔNG KẾT · BECOME THE MENTOR</div><h2>Hôm nay là người học, ngày mai là người dẫn lối</h2>
 <p class="prompt" style="border-style:solid">Ai cũng giỏi một điều gì đó. Dạy cho người khác giúp cả hai cùng giỏi hơn, thầy cô cũng vậy.</p>
 <h3>Cùng suy nghĩ</h3><ol><li>Mentor nào đã dạy em một mẹo hay? Mẹo đó là gì?</li><li>Khi nào em thấy dạy người khác giúp mình hiểu rõ hơn?</li><li>Em muốn trở thành mentor ở kỹ năng nào vào lần sau?</li><li>Em cảm ơn người dẫn lối nào của em trong tháng này?</li></ol>
 <p class="mut">Gợi ý chụp ảnh: khoảnh khắc học sinh dạy lại thầy cô một kỹ năng mà các em vừa thắng.</p>
 <div class="btns"><button id="again">Chơi lại từ đầu</button><button class="ghost" id="back">Về màn hình chính</button></div></div>`,'end');
 $('#again').onclick=setup;$('#back').onclick=home}

// ===== HƯỚNG DẪN & MENU =====
function guide(){const m=$('#modal');m.hidden=false;
 m.innerHTML=`<div class="card gold pop"><div class="tag">DÀNH CHO THẦY CÔ</div><h2>Hướng dẫn tổ chức Tech Club Tuần 4</h2>
 <p><b>Chủ đề tuần:</b> Become the mentor. Học sinh hiểu rằng ai cũng giỏi một điều gì đó, và dạy lại cho người khác giúp cả hai cùng giỏi hơn, thầy cô cũng vậy. Thông điệp chung của tháng: <i>“Người thầy giỏi không trao sẵn đáp án, mà giúp con tự tìm ra.”</i></p>
 <h3>Chuẩn bị</h3><ul><li>Mở file này trên máy chiếu. File chạy offline, không cần internet hay tài khoản.</li><li>Học sinh làm việc theo nhóm bạn đôi (một anh/chị lớn và một em nhỏ) để ai cũng tham gia được.</li><li>Chuẩn bị giấy bút cho vòng vẽ và vòng prompt. Vòng sửa lỗi có thể dùng bài Scoolcode thật.</li><li>Có thể chỉnh nội dung các vòng ở đầu phần script của file.</li></ul>
 <h3>Gợi ý thời lượng (60 phút)</h3><table><tr><th>Phần</th><th>Thời lượng</th><th>Việc chính</th></tr>
 <tr><td>Mở đầu</td><td>5 phút</td><td>Giới thiệu và nhập danh sách thí sinh.</td></tr>
 <tr><td>1. Vòng thử thách</td><td>20 phút</td><td>Sáu vòng nhanh, thầy cô thi đấu cùng các em.</td></tr>
 <tr><td>2. Nhà vô địch</td><td>3 phút</td><td>Công bố mentor của từng kỹ năng.</td></tr>
 <tr><td>3. Góc mentor</td><td>15 phút</td><td>Ba lượt xoay góc, mỗi lượt 4 phút.</td></tr>
 <tr><td>4. Show me what you learned</td><td>12 phút</td><td>Mỗi em khoe một mẹo.</td></tr>
 <tr><td>Rematch và tổng kết</td><td>5 phút</td><td>Đấu lại một vòng và trả lời các câu hỏi cuối giờ.</td></tr></table>
 <h3>Lưu ý</h3><ul><li>Thầy cô cũng thi đấu. Nếu thua, hãy vui vẻ làm học trò của mentor.</li><li>Khen cách các em giải thích và dạy, không chỉ khen người thắng.</li></ul>
 <div class="btns"><button id="gc">Đóng ✕</button></div></div>`;$('#gc').onclick=closeModal}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function menu(){const m=$('#modal');m.hidden=false;
 m.innerHTML=`<div class="card gold pop"><div class="tag">MENU</div><h2>Đi tới</h2>
 <div class="btns"><button class="ghost" data-go="home">⌂ Màn hình chính</button><button class="ghost" data-go="intro">Giới thiệu</button><button class="ghost" data-go="setup">Danh sách thí sinh</button><button class="ghost" data-go="guide">Hướng dẫn cho thầy cô</button></div>
 <h3>Các phần</h3><div class="btns"><button class="ghost" data-go="arena">1 Vòng thử thách</button><button class="ghost" data-go="champs">2 Nhà vô địch</button><button class="ghost" data-go="corners">3 Góc mentor</button><button class="ghost" data-go="learn">4 Show me</button><button class="ghost" data-go="rematch">Rematch</button></div>
 <h3>Vào thẳng một vòng</h3><div class="btns">${ROUNDS.map((r,i)=>`<button class="ghost" data-r="${i}">${r.ic} ${i+1}</button>`).join('')}</div>
 <div class="btns"><button id="mClose">Đóng ✕</button></div></div>`;
 const go={home,intro,setup,guide,arena,champs,corners,learn,rematch};
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const k=b.dataset.go;closeModal();go[k]()});
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{closeModal();round(+b.dataset.r)});$('#mClose').onclick=closeModal}
$('#hMenu').onclick=menu;
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
intro();
</script>
</body>
</html>
